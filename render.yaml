# Render Infrastructure as Code (root-level)
# Docs: https://render.com/docs/infrastructure-as-code
# This file supersedes backend/render.yaml (which had indentation issues and was not at repo root).

services:
  - type: web
    name: dividafacil-web
    runtime: python
    autoDeploy: true
    plan: free
    region: oregon
    rootDir: backend
  buildCommand: pip install -r requirements.txt && alembic upgrade head
  # Gunicorn with Uvicorn workers for production robustness
  # Adjust WORKERS via env var if needed (default 3 here). On free tier keep modest.
  startCommand: gunicorn web_app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WORKERS:-3} --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: APP_NAME
        value: DividaFacil
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: text  # change to 'json' in production for structured logs
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dividafacil-db
          property: connectionString

# Managed PostgreSQL database
# On first deploy, Render will provision this database and inject credentials.
databases:
  - name: dividafacil-db
    plan: free
    region: oregon
    ipAllowList: []
